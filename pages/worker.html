<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Worker Panel | FixMyCity</title>

    <link
        rel="stylesheet"
        href="../css/worker.css"
    >

</head>


<body>


    <!-- ================================= -->
    <!-- NAVBAR -->
    <!-- ================================= -->

    <header class="worker-navbar">

        <div class="worker-logo">

            <div class="logo-icon">
                F
            </div>

            <div>

                <h2>
                    FixMyCity
                </h2>

                <span>
                    Worker Panel
                </span>

            </div>

        </div>


        <nav class="worker-nav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="profile.html">
                My Profile
            </a>

            <button id="workerLogout">
                Logout
            </button>

        </nav>

    </header>



    <!-- ================================= -->
    <!-- MAIN -->
    <!-- ================================= -->

    <main class="worker-page">

    <!-- HEADER -->
    <section class="worker-header">

        <div>
            <span class="page-label">
                WORKER PANEL
            </span>

            <h1>
                Welcome, <span id="workerName">Worker</span>
            </h1>

            <p>
                Manage and resolve the civic issues assigned to you.
            </p>
        </div>

    </section>


    <!-- STATS -->
    <section class="worker-stats">

        <div class="stat-card">

            <span class="stat-label">
                Assigned
            </span>

            <strong id="assignedCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span class="stat-label">
                Under Review
            </span>

            <strong id="reviewCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span class="stat-label">
                In Progress
            </span>

            <strong id="progressCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span class="stat-label">
                Resolved
            </span>

            <strong id="resolvedCount">
                0
            </strong>

        </div>

    </section>


    <!-- COMPLAINTS -->
    <section class="assigned-section">

        <div class="section-header">

            <div>

                <h2>
                    Assigned Complaints
                </h2>

                <p>
                    Complaints assigned to you by the administrator.
                </p>

            </div>

            <button
                id="refreshComplaintsBtn"
                class="refresh-btn"
            >
                Refresh
            </button>

        </div>


        <div
            id="complaintsContainer"
            class="complaints-container"
        >

            <p class="empty-message">
                Loading complaints...
            </p>

        </div>

    </section>

</main>


    <script src="../js/database.js"></script>

    <script src="../js/worker.js"></script>

</body>

</html>
